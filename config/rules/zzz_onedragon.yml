# ============================================================================
# 绝区零一条龙（ZenlessZoneZero-OneDragon · one_dragon 框架）日志规则集
#
# 依据：D:\Games\Tools\ZenlessZoneZero-OneDragon\.log 下 4 份 log.txt
#       （2026-11-23 ~ 2026-11-26），共 3,713 条记录 / 5 次运行：
#       INFO 3,672 / ERROR 41，没有 WARNING，没有异常堆栈，没有崩溃。
#
# 这个框架的日志和 BetterGI、MAA 都不同，三件事必须先说清楚：
#
# 1. 只有两级日志，ERROR 就是「某个应用失败了」。
#    每条失败都长这样，消息里带指令名和它自己的返回状态：
#        指令[ 兑换以太电池 ] 执行失败 返回状态 合成素材不足
#    ERROR 本来就少（41 条 / 5 次运行），按级别筛就够了，不需要复杂的模板。
#
# 2. 41 条 ERROR 里有一半是「假失败」。
#    指令[ 等待大世界画面 ] 是咖啡店用来等加载的子指令，父节点「等待大世界加载」
#    会反复调它、最多 60 次，直到画面出来。子指令每次失败都打一条 ERROR，
#    于是单次运行能刷 5 条红字，最后一次成功、咖啡店照常做完 —— 21 次全是这样。
#    把它当任务失败去终止，等于每天都被一次正常的加载等待打断。
#
# 3. 应用失败不会中断整轮，框架自己会跳过。
#    应用组对每个应用的处理是：失败 → 记 ERROR → 返回「下一个」→ 继续下一个应用。
#    日志里 5 次运行全部跑到「全部结束」，没有一个例外。
#    所以「某个应用失败」不能作为终止条件：停下来的代价是后面的情报板、咖啡店、
#    邮件、体力刷本全部作废，而它们本来是能做完的。
#
# 结论落到配置上：终止条件只留「整轮已经废了」的那几种（一条龙/应用组中止、
# 框架自身异常），应用级失败在下面登记为 ignore —— 保留可观测性，运行时放行。
#
# 用法（界面「日志规则」页）：
#   1. 加载本文件 → 日志目录会自动填成 .log，点试跑看每条规则的命中与样例；
#   2. 点「应用到脚本」→ 把 fail_fast / stall 写进脚本配置，运行时生效。
# ============================================================================

version: 1
id: zzz_onedragon
name: 绝区零一条龙（绝区零 · one_dragon）
description: one_dragon 框架的指令级错误与应用段打转判定

# 支持的游戏：取脚本配置里的游戏进程名，可写多个；留空表示通用，任何游戏都能加载。
games: ['ZenlessZoneZero.exe']

source:
  log_dir: D:\Games\Tools\ZenlessZoneZero-OneDragon\.log
  files: 4
  records: 3713
  err: 41

# ---------------------------------------------------------------------------
# 试跑取样：.log 下还有 python_launcher_framework.log（启动器自己拉的代码、
# 排版相同但只记 git 操作），没必要混进来。
# ---------------------------------------------------------------------------
probe:
  include: ['log.txt*']
  max_files: 4

# ---------------------------------------------------------------------------
# 运行时参数：写进脚本配置的 fail_fast 段
# error_patterns 不手写，由下面 level=fatal/task 的规则自动汇总
#
# 宽限 60 秒：命中后不立刻杀，先看这 60 秒里有没有自己恢复。
# 这个框架从「进不去游戏」到放弃要重试 60 次（约 60 秒），宽限太短会在
# 它自己快放弃之前抢先杀掉，报出来的原因反而不如程序自己的准确。
# ---------------------------------------------------------------------------
fail_fast:
  enabled: true
  # 只登记、不终止：一条龙的「打开并登录游戏失败」「进入游戏失败」只毁掉当前
  # 应用组，后面的应用还能接着跑。想恢复「命中即终止」改成 stop_task。
  action: report
  grace_seconds: 60

# ---------------------------------------------------------------------------
# 运行时参数：写进脚本配置的 stall 段（同一行在窗口内反复出现 = 原地打转）
#
# 实测 3 分钟滑窗里，重复最多的行是：
#   情报板「等待战斗画面加载 = 未找到 按键-交互」 27 次  ← 战斗加载中反复找交互键
#   推送成功                                     26 次  ← 每个应用结束推一条
#   打开游戏「等待游戏打开 = 重试」               23 次  ← 该节点重试预算就是 60 次
# 这三行在下面都登记成了 ignore，会被合并进 ignore_pattern 先排掉；
# 过滤之后剩下的最高频是「返回大世界 → 画面识别 = 返回」17 次。
# 阈值取 60：对过滤后的 17 次留了三倍余量，对原始峰值 27 次也翻了一倍。
# 真正的刷屏是几百上千条，中间这一大段空白说明这个阈值分得干净。
#
# 注意：这套日志里没有 DEBUG 级别，所以不需要 ignore_levels。
# ---------------------------------------------------------------------------
stall:
  enabled: true
  window_minutes: 3
  min_repeats: 60
  grace_seconds: 90

# ---------------------------------------------------------------------------
# 卡死打转：按「应用段」切分（试跑诊断用，暂不参与运行时终止）
#
# one_dragon 没有「状态机迭代」这种自述，但应用组每切换一个应用就打一条边界行：
#   指令[ 执行应用组 one_dragon ] 节点 执行应用 -> 执行应用 返回状态 下一个
# 用它切段，一段正好是一个应用的完整执行；「全部结束」是整轮的收尾。
#
# 段内：步进 = 每条节点流转行，推进 = 出现过的不同流转数。
# 实测 88 段的应用段分布（步进 / 不同流转 / 最长连续同一步骤）：
#   情报板          468 / 38 / 15   ← 11 轮委托战斗，正常
#   体力刷本        149 / 48 /  7   ← 正常
#   录像店营业       41 / 23 /  4   ← 正常
#   跑腿买咖啡       33 / 17 / 11   ← 正常
# 一个真正卡住的应用长这样：在 3~5 个节点之间来回，步进几百上千、不同流转始终个位数。
# 因此判据取「步进 ≥200 且不同流转 ≤8」。
#
# same_state_repeats=40：段内连续同一步骤的天花板是 15（情报板等战斗加载），
# 战斗加载节点的重试预算是 60，连续 40 次说明它烧掉了三分之二的预算还没进展。
# 注意「打开游戏 → 等待游戏打开」单次运行会连续重试 22 次，但那是应用组之外
# 的启动阶段，不在应用段里，不会误报。
# ---------------------------------------------------------------------------
loop:
  enabled: true
  # 界面上的叫法（正则太长，界面上直接铺开会撑爆卡片）
  segment_label: '「应用切换行」'
  # 应用边界行：进入下一个应用 / 该应用已完成 / 该应用未启用
  segment_start: '指令\[ 执行应用组 [^\]]* \] 节点 执行应用 -> 执行应用 返回状态 (?:下一个|应用已完成|应用未启用)'
  # 整轮收尾
  segment_end: '指令\[ 执行应用组 [^\]]* \] 节点 执行应用 -> 执行应用 返回状态 全部结束'
  # 节点流转行：首个节点是「节点 X 返回状态」，后续是「节点 X -> Y 返回状态」，
  # 用非贪婪一次性覆盖两种写法，捕获到的就是整条流转
  step_pattern: '节点 (.+?) 返回状态'
  # 留空 = 不用「推进事件」计数，改用段内不同流转数当推进量
  progress_pattern: ''
  min_iterations: 200
  max_progress: 8
  same_state_repeats: 40
  # 参与运行时终止。应用段正常结束（或切到下一个应用）会撤销判定，
  # 只有「段内一直不推进、90 秒还没过去」才真的终止。
  runtime: true
  grace_seconds: 90

# ---------------------------------------------------------------------------
# 规则表
#   level:  fatal（整轮无处可救）/ task（进不去游戏，剩下的也做不了）
#           ignore（登记但放行：框架自愈，或失败一个应用不影响其它应用）
#   action: stop_chain（终止整条链）/ stop_task（跳过当前任务）/ continue（放行）
#
# fatal 与 task 在本批日志里都是 0 命中 —— 这 5 次运行确实一次都没塌。
# 留着是因为它们对应框架源码里明确的「整轮中止」路径，属于兜底。
# ---------------------------------------------------------------------------
rules:
  # ===== fatal：整轮已经废了 =====
  - id: chain.top-failed
    name: 一条龙执行失败
    level: fatal
    action: stop_chain
    match: '指令\[ 一条龙 \] 执行失败'
    hits: 0
    hint: >-
      顶层指令返回失败，说明连「检测窗口 → 打开并进入游戏 → 执行应用组」这一步都没走完。
      下面的应用一个都没跑，继续等没有意义。

  - id: group.aborted
    name: 应用组中止
    level: fatal
    action: stop_chain
    match: '指令\[ 执行应用组 [^\]]* \] 执行失败'
    hits: 0
    hint: >-
      应用组本身失败（不是某个应用失败）。应用组正常收尾一定是「全部结束」，
      失败退出意味着剩下的应用被整批跳过，整轮基本白跑。

  - id: ops.init-failed
    name: 指令初始化失败
    level: fatal
    action: stop_chain
    match: '初始化失败'
    hits: 0
    hint: >-
      框架源码 operation.py 里 `_init_before_execute` 抛异常时的日志，
      随后直接 op_fail 返回。通常是配置读到一半坏了或依赖缺失，
      同一个错误会在每个指令上重复发生。

  - id: ops.node-exception
    name: 节点执行出错（异常）
    level: fatal
    action: stop_chain
    match: '执行出错'
    hits: 0
    hint: >-
      节点里抛了未捕获异常，框架会存一张现场截图再重试一次，仍失败就退出该指令。
      与「执行失败」的区别是：这是程序错误（`执行出错` 后面可能跟截图文件名），
      不是识别失败，重试用处不大。

  - id: ops.bad-result
    name: 指令返回结果异常
    level: fatal
    action: stop_chain
    match: '执行返回结果错误'
    hits: 0
    hint: >-
      节点没有返回 成功/失败/重试 三者之一，框架无法判断下一步，直接失败退出。
      出现即说明脚本或插件写坏了，不是环境问题。

  # ===== task：进不去游戏，后面的都做不了 =====
  - id: entry.login-failed
    name: 打开并登录游戏失败
    level: task
    action: stop_task
    match: '指令\[ 打开并登录游戏 \] 执行失败'
    hits: 0
    hint: >-
      窗口检测、启动、登录这条链走不通。实测 5 次运行都是「打开游戏后等 22 秒进大世界」，
      一旦这里失败，后面每个应用都会卡在「检测游戏窗口」。

  - id: entry.enter-failed
    name: 进入游戏失败
    level: task
    action: stop_task
    match: '指令\[ 进入游戏 \] 执行失败'
    hits: 0
    hint: >-
      登录界面到主界面之间失败（实测这一段最慢要等 11 次「加载配置数据中」）。
      常见原因是登录界面弹了公告、活动页，或账号需要重新验证。

  # ===== ignore：登记但放行 =====
  # 下面六条覆盖了本批日志 41 条 ERROR 里的全部 41 条：
  # 都是「某个指令失败但整轮照常跑完」，停下来的代价大于收益。
  - id: task.wait-world-noise
    name: 等待大世界画面（子指令重试）
    level: ignore
    action: continue
    match: '指令\[ 等待大世界画面 \] 执行失败 返回状态 未到达大世界'
    hits: 21
    hint: >-
      41 条 ERROR 里有 21 条是它，占一半。咖啡店的「等待大世界加载」节点会反复调用这个
      子指令（重试预算 60 次），每次失败都打一条 ERROR，最后一次成功、咖啡店照常做完。
      实测每次运行刷 4~5 条，全部自愈 —— 这是日志里最大的假信号。

  - id: task.copy-missing
    name: 找不到副本 / 代理人方案培养
    level: ignore
    action: continue
    match: '执行失败 返回状态 找不到'
    hits: 8
    hint: >-
      5 次运行里 4 次都出现，固定是「代理人方案培养」这个副本找不到（连带传送指令一起失败）。
      这不是偶发识别问题，是配置里选了当前账号没解锁、或当期界面里不存在的副本 ——
      想去掉这条红字得去改脚本配置，而不是加重试。

  - id: task.no-material
    name: 合成素材不足（以太电池）
    level: ignore
    action: continue
    match: '执行失败 返回状态 合成素材不足'
    hits: 4
    hint: >-
      想用材料换以太电池但材料不够。属于正常的业务性「做不了」，不是故障：
      体力照样去刷本，只是不先换电池。每次运行都会出现一次。

  - id: task.checkin-failed
    name: 米游社签到失败
    level: ignore
    action: continue
    match: '指令\[ 米游社签到 \] 执行失败'
    hits: 5
    hint: >-
      5 次运行全失败，返回状态是「checkin.py 退出码 1」。真实原因在上一条日志里：
      cookie_token 续期失败（-464），即网页端登录态过期，需要重新登录一次。
      它只是签到插件失败，和游戏内任务无关，放着不影响其它应用。

  - id: task.notify-failed
    name: 通知推送失败
    level: ignore
    action: continue
    match: '指令\[ 通知 \] 执行失败'
    hits: 1
    hint: >-
      推送渠道拒收（配置里是 DD_BOT）。整轮 166 条「推送成功」，只有 1 次失败，
      属于渠道偶发抖动，不影响游戏流程。

  - id: task.stage-failed
    name: 活跃度奖励 / 咖啡店取餐失败
    level: ignore
    action: continue
    match: '指令\[ (?:活跃度奖励|咖啡店) \] 执行失败'
    hits: 2
    hint: >-
      活跃度奖励「返回状态 失败」1 次（奖励暂无可领），咖啡店「未找到 不可贪杯确认」1 次
      （没有该确认弹窗就直接跳过点单后处理）。两者都不影响后续应用。

  # ===== ignore：高频噪音 =====
  # 这几条本身不是错误，列出来是因为它们会进入 stall 的忽略正则：
  # 不排掉的话「同一行重复」会被它们撑爆，打转判定永远误报。
  - id: noise.push-ok
    name: 推送成功（每个应用一条）
    level: ignore
    action: continue
    match: '推送成功'
    hits: 166
    hint: >-
      每个应用结束推一条通知，3 分钟窗口内最多 26 条，是日志里频次最高的行。

  - id: noise.open-game-wait
    name: 等待游戏打开（设计内重试）
    level: ignore
    action: continue
    match: '节点 打开游戏 -> 等待游戏打开 返回状态 重试'
    hits: 106
    hint: >-
      这个节点的重试预算被显式设成 60 次（open_game.py），实测每次运行连续重试 22 次、
      约 22 秒进游戏。它是「正常等待」，绝不能当打转。

  - id: noise.battle-wait
    name: 战斗加载中反复找交互键
    level: ignore
    action: continue
    match: '节点 加载自动战斗指令 -> 等待战斗画面加载 返回状态 未找到 按键-'
    hits: 153
    hint: >-
      战斗画面没出来之前一直按不到交互键 / 普攻键，情报板和实战模拟室各刷一批。
      3 分钟窗口内峰值 27 条，是本规则集里唯一需要拿来定阈值的行。

  - id: noise.state-reset
    name: 战斗状态重置与配置加载
    level: ignore
    action: continue
    match: '正在清空 \d+ 个状态|所有状态已重置为初始值|已从配置加载 \['
    hits: 39
    hint: >-
      自动战斗模块每场战斗开头重置状态、加载目标锁定间隔，每场三条，内容完全一样。

  - id: noise.audio
    name: 音频录制与按键状态
    level: ignore
    action: continue
    match: '开始录制游戏进程音频|松开所有按键|剩余电量 \d+'
    hits: 63
    hint: >-
      战斗助手的过程性输出：录制游戏音频、每场结束松开按键、每次识别电量打一行。
      高频且无信息量。

  - id: noise.ult-ready
    name: 终结技可用提示
    level: ignore
    action: continue
    match: '终结技可用，增加状态'
    hits: 58
    hint: >-
      自动战斗判断前台角色终结技可用时打一行，一场战斗几十条，同角色同文本。
